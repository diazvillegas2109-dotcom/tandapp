<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Tandapp Cloud v6.6</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800&display=swap" rel="stylesheet"/>
<style>
  :root { --bg: #f3f4f6; --accent: #4f46e5; --text: #111827; --radius: 14px; --green: #22c55e; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Outfit', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  .header { background: var(--accent); color: white; padding: 1rem 1.5rem; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
  #auth-screen { position: fixed; inset: 0; z-index: 1000; background: var(--bg); display: flex; align-items: center; justify-content: center; padding: 1rem; }
  .card { background: white; padding: 2rem; border-radius: var(--radius); width: 100%; max-width: 380px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; }
  .input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 1rem; font-family: 'Outfit'; outline: none; }
  .btn { background: var(--accent); color: white; width: 100%; padding: 12px; border-radius: 8px; border: none; font-weight: 700; cursor: pointer; }
  .btn-outline { background: white; border: 1px solid var(--accent); color: var(--accent); margin-top: 10px; }
  #msg { font-size: 11px; color: #ef4444; margin-top: 1rem; }
  #v-tag { position: fixed; top: 5px; left: 5px; background: #000; color: #fff; font-size: 9px; padding: 2px 6px; border-radius: 3px; z-index: 2000; }
  .main { padding: 1.5rem; max-width: 600px; margin: 0 auto; }
  .tanda-card { background: white; padding: 1.25rem; border-radius: 12px; margin-bottom: 10px; border: 1px solid #eee; cursor: pointer; }
</style>
</head>
<body>
<div id="v-tag">VERSIÓN 6.6 - CLOUD</div>

<div id="auth-screen">
  <div class="card">
    <div style="font-size: 40px; margin-bottom: 10px;">🏦</div>
    <h2 style="font-weight: 800; margin-bottom: 1.5rem;">Tandapp Cloud</h2>
    <input type="email" id="email" class="input" placeholder="Correo electrónico">
    <input type="password" id="pass" class="input" placeholder="Contraseña (6+ letras)">
    <button class="btn" onclick="login()">Entrar / Registrarse</button>
    <p id="msg"></p>
  </div>
</div>

<div id="app-content" style="display:none">
  <header class="header">
    <span style="font-weight:800">Tandapp</span>
    <button onclick="logout()" style="background:none; border:none; color:white; font-size:12px; cursor:pointer;">Salir</button>
  </header>
  <div class="main" id="root"></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
  import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const config = {
    apiKey: "AIzaSyBiOcXDDBpZ8zP5VeEQPqJp5GgxVEt-9UA",
    authDomain: "tandapp-dc4f5.firebaseapp.com",
    projectId: "tandapp-dc4f5",
    storageBucket: "tandapp-dc4f5.firebasestorage.app",
    messagingSenderId: "216117044294",
    appId: "1:216117044294:web:fa7f7d925adf6e835b9647"
  };

  const app = initializeApp(config);
  const auth = getAuth(app);
  const db = getFirestore(app);
  let userGlobal = null;

  window.login = async () => {
    const e = document.getElementById('email').value, p = document.getElementById('pass').value, m = document.getElementById('msg');
    m.innerText = "Conectando...";
    try {
      await signInWithEmailAndPassword(auth, e, p);
    } catch (err) {
      if (err.code === 'auth/user-not-found' || err.code === 'auth/invalid-credential') {
        try { await createUserWithEmailAndPassword(auth, e, p); } catch(e2) { m.innerText = "Error: " + e2.message; }
      } else { m.innerText = "Error: " + err.message; }
    }
  };

  window.logout = () => signOut(auth);

  onAuthStateChanged(auth, async (user) => {
    if (user) {
      userGlobal = user;
      document.getElementById('auth-screen').style.display = 'none';
      document.getElementById('app-content').style.display = 'block';
      render();
    } else {
      document.getElementById('auth-screen').style.display = 'flex';
      document.getElementById('app-content').style.display = 'none';
    }
  });

  function render() {
    document.getElementById('root').innerHTML = `
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px">
        <h2 style="font-weight:800">Tus Tandas</h2>
        <button class="btn" style="width:auto; padding:8px 15px" onclick="alert('¡Ya estás adentro! Ahora puedes crear tandas.')">+ Nueva</button>
      </div>
      <div class="tanda-card">
        <div style="font-weight:800; color:var(--accent)">¡Bienvenido al Cloud!</div>
        <p style="font-size:12px; color:#666">Tus datos ahora se guardan en Google.</p>
      </div>`;
  }
</script>
</body>
</html>
