<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Tandapp Cloud v6.3</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
/* DISEÑO ÍNDIGO */
:root { --bg: #f3f4f6; --accent: #4f46e5; --text: #111827; --radius: 14px; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Outfit', sans-serif; background: var(--bg); color: var(--text); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1rem; }
.auth-card { background: white; padding: 2rem; border-radius: var(--radius); width: 100%; max-width: 380px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; border: 1px solid #eee; }
.btn-primary { background: var(--accent); color: white; width: 100%; padding: 12px; border-radius: 8px; border: none; font-family: 'Outfit'; font-weight: 700; cursor: pointer; margin-top: 10px; }
.input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-family: 'Outfit'; margin-bottom: 1rem; outline: none; }
#status-tag { position: fixed; top: 10px; left: 10px; font-size: 10px; background: #000; color: #fff; padding: 2px 6px; border-radius: 4px; z-index: 2000; }
</style>
</head>
<body>

<div id="status-tag">VERSIÓN 6.3 - CLOUD</div>

<div id="auth-screen">
  <div class="auth-card">
    <div style="font-size: 40px; margin-bottom: 10px;">🏦</div>
    <h2 style="font-weight: 800; margin-bottom: 5px;">Tandapp Cloud</h2>
    <p style="font-size: 12px; color: #666; margin-bottom: 1.5rem;">Si ves esto, el código se actualizó.</p>
    <input type="email" id="auth-email" class="input" placeholder="Correo electrónico">
    <input type="password" id="auth-pass" class="input" placeholder="Contraseña (6+ caracteres)">
    <button class="btn-primary" onclick="handleAuth()">Entrar / Registrarse</button>
    <p id="auth-msg" style="font-size: 11px; color: #ef4444; margin-top: 1rem; font-weight: 600;"></p>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

  // CLAVES VERIFICADAS CARÁCTER POR CARÁCTER
  const firebaseConfig = {
    apiKey: "AIzaSyBiOcXDDBpZ8zP5VeEQPqJp5GgxVEt-9UA",
    authDomain: "tandapp-dc4f5.firebaseapp.com",
    projectId: "tandapp-dc4f5",
    storageBucket: "tandapp-dc4f5.firebasestorage.app",
    messagingSenderId: "216117044294",
    appId: "1:216117044294:web:fa7f7d925adf6e835b9647",
    measurementId: "G-BDX33WZWWN"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  window.handleAuth = async () => {
    const email = document.getElementById('auth-email').value;
    const pass = document.getElementById('auth-pass').value;
    const msg = document.getElementById('auth-msg');
    msg.innerText = "Cargando...";

    try {
      await signInWithEmailAndPassword(auth, email, pass);
      alert("¡Éxito! Ya puedes entrar.");
    } catch (e) {
      if (e.code === 'auth/user-not-found' || e.code === 'auth/invalid-credential') {
        try { 
          await createUserWithEmailAndPassword(auth, email, pass); 
          alert("Cuenta creada con éxito.");
        } catch(err) { msg.innerText = "Error: " + err.code; }
      } else { 
        msg.innerText = "Error: " + e.code; 
      }
    }
  };
</script>
</body>
</html>
